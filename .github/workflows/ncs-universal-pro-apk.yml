name: NCS Universal Pro - Build Native APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main, ncs-universal-pro-v1]
    paths:
      - 'universal-pro/**'
      - '.github/workflows/ncs-universal-pro-apk.yml'
  push:
    branches: [ncs-universal-pro-v1, feature/universal-v17-cloud-bridge, feature/ncs-universal-single-app-native-foundation]
    paths:
      - 'universal-pro/**'
      - '.github/workflows/ncs-universal-pro-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: universal-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.10.2 from official distribution (retry transient 504)
        run: |
          set -euo pipefail
          if command -v gradle >/dev/null 2>&1; then
            AVAILABLE="$(gradle --version | grep -m1 '^Gradle ' || true)"
            if echo "$AVAILABLE" | grep -Eq '^Gradle 8\\.'; then
              echo "Using preinstalled $AVAILABLE (official runner image)."
              exit 0
            fi
          fi
          URL="https://downloads.gradle.org/distributions/gradle-8.10.2-bin.zip"
          SHA_URL="https://downloads.gradle.org/distributions/gradle-8.10.2-bin.zip.sha256"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 "$URL" -o "$RUNNER_TEMP/gradle.zip"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 "$SHA_URL" -o "$RUNNER_TEMP/gradle.sha256"
          EXPECTED="$(tr -d '\r\n ' < "$RUNNER_TEMP/gradle.sha256")"
          echo "$EXPECTED  $RUNNER_TEMP/gradle.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent release signing certificate
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.NCS_ANDROID_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.NCS_ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NCS_ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NCS_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ncs-universal-release.jks"
            chmod 600 "$RUNNER_TEMP/ncs-universal-release.jks"
            echo "NCS_ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/ncs-universal-release.jks" >> "$GITHUB_ENV"
            echo "NCS_ANDROID_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NCS_ANDROID_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NCS_ANDROID_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "NCS_STABLE_SIGNING=1" >> "$GITHUB_ENV"
            echo "Permanent release signing configured. Same identity on all future builds."
          else
            echo "NCS_STABLE_SIGNING=0" >> "$GITHUB_ENV"
            echo "No permanent release key. Compile-only validation; APK distribution disabled."
          fi
      - name: Compile NEW CITY STYLE Universal APK
        run: |
          if [ "$NCS_STABLE_SIGNING" = "1" ]; then
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Upload stable signed Universal APK
        if: env.NCS_STABLE_SIGNING == '1'
        uses: actions/upload-artifact@v4
        with:
          name: NCS-Universal-Permanent-App-APK
          path: universal-pro/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

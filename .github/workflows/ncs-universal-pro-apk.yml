name: NCS Universal Pro - Build Native APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'universal-pro/**'
      - '.github/workflows/ncs-universal-pro-apk.yml'
  push:
    branches: [ncs-universal-pro-v1]
    paths:
      - 'universal-pro/**'
      - '.github/workflows/ncs-universal-pro-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: universal-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile isolated demo APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NCS-Universal-Pro-V1-Demo-APK
          path: universal-pro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
